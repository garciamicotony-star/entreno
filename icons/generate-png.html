<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar iconos PNG</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
  button { padding: 12px 24px; background: #e8ff47; color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:hover { opacity: 0.85; }
  canvas { border-radius: 8px; }
  p { color: #aaa; font-size: 13px; }
</style>
</head>
<body>
<h2>Generador de iconos PNG</h2>
<p>Abre este archivo en Chrome, pulsa los botones y guarda los PNG en la carpeta <code>icons/</code></p>
<canvas id="c192" width="192" height="192"></canvas>
<button onclick="download(192)">Descargar icon-192.png</button>
<canvas id="c512" width="512" height="512"></canvas>
<button onclick="download(512)">Descargar icon-512.png</button>

<script>
function drawIcon(ctx, size) {
  const s = size / 192;
  ctx.clearRect(0, 0, size, size);

  // Background
  ctx.fillStyle = '#13131a';
  const r = 36 * s;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  function rect(x, y, w, h, rx, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    const ax = x * s, ay = y * s, aw = w * s, ah = h * s, ar = rx * s;
    ctx.moveTo(ax + ar, ay);
    ctx.lineTo(ax + aw - ar, ay); ctx.quadraticCurveTo(ax + aw, ay, ax + aw, ay + ar);
    ctx.lineTo(ax + aw, ay + ah - ar); ctx.quadraticCurveTo(ax + aw, ay + ah, ax + aw - ar, ay + ah);
    ctx.lineTo(ax + ar, ay + ah); ctx.quadraticCurveTo(ax, ay + ah, ax, ay + ah - ar);
    ctx.lineTo(ax, ay + ar); ctx.quadraticCurveTo(ax, ay, ax + ar, ay);
    ctx.closePath();
    ctx.fill();
  }

  // Bar
  rect(76, 88, 40, 16, 3, '#e8ff47');
  // Left inner plate
  rect(56, 73, 20, 46, 4, '#e8ff47');
  // Left outer plate
  rect(34, 66, 22, 60, 5, '#ff6b35');
  // Right inner plate
  rect(116, 73, 20, 46, 4, '#e8ff47');
  // Right outer plate
  rect(136, 66, 22, 60, 5, '#ff6b35');
}

function download(size) {
  const canvas = document.getElementById('c' + size);
  const ctx = canvas.getContext('2d');
  drawIcon(ctx, size);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'icon-' + size + '.png';
  a.click();
}

// Preview on load
[192, 512].forEach(size => {
  const canvas = document.getElementById('c' + size);
  const ctx = canvas.getContext('2d');
  drawIcon(ctx, size);
  canvas.style.width = '96px';
  canvas.style.height = '96px';
});
</script>
</body>
</html>
