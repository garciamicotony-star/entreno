<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guía Entreno">
<title>Guía Entreno</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1c1c26;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --accent3: #4ecdc4;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --border: #2a2a38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg);
  }
  .login-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; padding: 36px 28px; width: 100%; max-width: 340px;
  }
  .login-logo { text-align: center; margin-bottom: 30px; }
  .login-logo .logo-icon { font-size: 44px; display: block; margin-bottom: 10px; }
  .login-logo h2 { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 3px; color: var(--text); margin-bottom: 4px; }
  .login-logo p { font-size: 12px; color: var(--muted); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 13px 14px; color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  .field input:focus { border-color: var(--accent); }
  .btn-login { width: 100%; background: var(--accent); color: #0a0a0f; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 6px; transition: opacity 0.2s; }
  .btn-login:active { opacity: 0.8; }
  .login-error { color: #ff6b6b; font-size: 12px; text-align: center; margin-top: 12px; display: none; }

  /* ── APP SHELL ── */
  #app { display: none; padding-bottom: 48px; }

  .header { background: linear-gradient(135deg, #1c1c26 0%, #0f0f18 100%); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px; color: var(--accent); }
  .btn-logout { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .btn-logout:active { background: var(--surface); color: var(--text); }

  /* ── SEGMENTED NAV (main + plan weeks) ── */
  .seg-tabs { display: flex; padding: 8px 14px 0; gap: 6px; }
  .seg-tab { flex: 1; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--border); background: transparent; color: var(--muted); transition: all 0.2s; font-family: 'DM Sans', sans-serif; text-align: center; }
  .seg-tab.active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); }

  /* ── WEEK NAV (alternativas) ── */
  .week-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; }
  .week-arrow { width: 38px; height: 38px; border-radius: 11px; border: 1.5px solid var(--border); background: transparent; color: var(--text); font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: 'DM Sans', sans-serif; line-height: 1; }
  .week-arrow:disabled { opacity: 0.25; cursor: default; }
  .week-arrow:not(:disabled):active { background: var(--surface); }
  .week-center { text-align: center; }
  .week-sublabel { font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--muted); }
  .week-label { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--text); line-height: 1.1; }

  /* ── DAY TABS ── */
  .tabs { display: flex; padding: 8px 14px 12px; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: transparent; color: var(--muted); transition: all 0.2s; }
  .tab.active { background: var(--accent); color: #0a0a0f; border-color: var(--accent); }

  /* ── SECTIONS (alternativas) ── */
  .section { display: none; padding: 10px 16px; }
  .section.active { display: block; animation: fadeIn 0.3s cubic-bezier(0.22,1,0.36,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 60px 20px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }

  /* ── PROGRESS BAR (alternativas) ── */
  .progress-wrap { display: flex; align-items: center; gap: 10px; padding: 6px 0 2px; }
  .progress-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1); width: 0%; }
  .progress-fill.complete { background: var(--accent3); }
  .progress-label { font-size: 11px; color: var(--muted); white-space: nowrap; font-weight: 600; min-width: 82px; text-align: right; }

  /* ── MUSCLE GROUP ── */
  .muscle-group { font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 2px; color: var(--accent2); margin: 18px 0 8px; }
  .muscle-group:first-of-type { margin-top: 12px; }

  /* ── EXERCISE CARD (alternativas) ── */
  .exercise-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s, opacity 0.3s; }
  .exercise-card.open { border-color: rgba(255,107,53,0.6); }
  .exercise-card.done { opacity: 0.5; }
  .exercise-card.done.open { opacity: 1; }
  .card-header { display: flex; align-items: center; padding: 12px 14px; gap: 9px; }
  .ex-icon { width: 36px; height: 36px; border-radius: 9px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
  .exercise-card.done .ex-name { text-decoration: line-through; color: var(--muted); }
  .ex-muscle { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .done-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.25s; color: transparent; font-size: 14px; font-weight: 800; line-height: 1; font-family: 'DM Sans', sans-serif; }
  .done-btn.active { background: var(--accent); border-color: var(--accent); color: #0a0a0f; }
  .done-btn:active { transform: scale(0.87); }
  .alt-trigger { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(255,107,53,0.35); background: rgba(255,107,53,0.08); cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
  .alt-trigger span { font-size: 10px; font-weight: 700; color: var(--accent2); white-space: nowrap; }
  .alt-trigger .chevron { font-size: 13px; color: var(--accent2); transition: transform 0.3s cubic-bezier(0.22,1,0.36,1); }
  .exercise-card.open .alt-trigger .chevron { transform: rotate(180deg); }
  .card-body { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.45s ease, opacity 0.3s ease; }
  .exercise-card.open .card-body { max-height: 3200px; opacity: 1; }
  .card-body-content { padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .alt-header { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 12px 0 8px; }
  .alt-item { background: rgba(255,107,53,0.07); border: 1px solid rgba(255,107,53,0.18); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .alt-item:last-child { margin-bottom: 0; }
  .app-name { display: inline-flex; align-items: center; gap: 5px; background: rgba(78,205,196,0.12); border: 1px solid rgba(78,205,196,0.3); border-radius: 6px; padding: 3px 8px; margin-bottom: 6px; }
  .app-name-label { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent3); }
  .app-name-value { font-size: 11px; font-weight: 700; color: var(--accent3); }
  .alt-item-name { font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
  .alt-item-desc { font-size: 12px; color: #b0b0c0; line-height: 1.65; margin-bottom: 8px; }
  .steps-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .step { display: flex; gap: 8px; margin-bottom: 6px; align-items: flex-start; }
  .step-num { width: 18px; height: 18px; border-radius: 4px; background: var(--accent2); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .step-text { font-size: 12px; color: #c0c0d0; line-height: 1.55; }
  .tip { background: rgba(232,255,71,0.06); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-top: 8px; font-size: 12px; color: #c0c0a0; line-height: 1.55; }
  .tip strong { color: var(--accent); }

  /* ════════════════════════════════════════
     MI PLAN — STYLES
  ════════════════════════════════════════ */

  #plan-content { padding: 12px 16px 48px; display: none; animation: fadeIn 0.3s cubic-bezier(0.22,1,0.36,1); }

  /* Day header strip */
  .plan-day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; padding-top: 4px; }
  .plan-day-title { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 1px; color: var(--text); }
  .plan-count { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.2px; }
  .btn-reset { padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .btn-reset:active { background: rgba(255,107,53,0.1); color: var(--accent2); border-color: rgba(255,107,53,0.4); }

  /* Plan progress bar */
  .plan-pbar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
  .plan-pfill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.45s cubic-bezier(0.22,1,0.36,1); width: 0%; }
  .plan-pfill.complete { background: var(--accent3); }

  /* Exercise row */
  .plan-ex {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 13px; padding: 13px 14px; margin-bottom: 8px;
    cursor: pointer; transition: opacity 0.3s, border-color 0.2s;
    user-select: none;
  }
  .plan-ex.done { opacity: 0.45; }
  .plan-ex:active { opacity: 0.7; }

  .pex-num {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--surface); color: var(--muted);
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
  }
  .plan-ex.done .pex-num { background: var(--accent); color: #0a0a0f; }

  .pex-name {
    flex: 1; font-size: 13px; font-weight: 600; color: var(--text);
    line-height: 1.35; transition: color 0.2s;
  }
  .plan-ex.done .pex-name { text-decoration: line-through; color: var(--muted); }

  .pex-check {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--border); background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: transparent;
    flex-shrink: 0; transition: all 0.25s;
  }
  .plan-ex.done .pex-check { background: var(--accent); border-color: var(--accent); color: #0a0a0f; }

  /* Swipe hint (dots) */
  .plan-dots { display: flex; justify-content: center; gap: 6px; padding: 18px 0 4px; }
  .plan-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
  .plan-dot.active { background: var(--accent); width: 18px; border-radius: 3px; }

  /* ── COMPLETION OVERLAY ── */
  .completion-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    align-items: center; justify-content: center;
    z-index: 200; padding: 24px; display: none;
  }
  .completion-overlay.show { display: flex; }
  .completion-card {
    background: var(--card); border: 1px solid rgba(232,255,71,0.35);
    border-radius: 24px; padding: 44px 28px 36px; text-align: center;
    width: 100%; max-width: 320px;
    animation: popIn 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes popIn { from { transform: scale(0.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .completion-emoji { font-size: 60px; display: block; margin-bottom: 14px; animation: bounce 0.6s cubic-bezier(0.22,1,0.36,1) 0.2s both; }
  @keyframes bounce { 0% { transform: scale(0) rotate(-10deg); } 70% { transform: scale(1.15) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
  .completion-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; color: var(--accent); margin-bottom: 8px; }
  .completion-sub { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 30px; }
  .completion-btn { background: var(--accent); color: #0a0a0f; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; width: 100%; transition: opacity 0.2s; }
  .completion-btn:active { opacity: 0.8; }
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">💪</span>
      <h2>GUÍA ENTRENO</h2>
      <p>Accede a tu plan de entrenamiento</p>
    </div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="inp-user" autocomplete="username" placeholder="usuario">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="inp-pass" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div id="login-error" class="login-error">Usuario o contraseña incorrectos</div>
    <button class="btn-login" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <div class="header">

    <!-- Top bar -->
    <div class="header-top">
      <div class="header-title">GUÍA ENTRENO</div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>

    <!-- Main section selector -->
    <div class="seg-tabs">
      <button class="seg-tab active" id="main-tab-alt"  onclick="showMain('alt',this)">Alternativas</button>
      <button class="seg-tab"        id="main-tab-plan" onclick="showMain('plan',this)">Mi Plan</button>
    </div>

    <!-- ── ALTERNATIVAS controls ── -->
    <div id="alt-controls">
      <div class="week-nav">
        <button class="week-arrow" id="btn-prev" onclick="prevWeek()" disabled>‹</button>
        <div class="week-center">
          <div class="week-sublabel">SEMANA</div>
          <div class="week-label" id="week-label">—</div>
        </div>
        <button class="week-arrow" id="btn-next" onclick="nextWeek()" disabled>›</button>
      </div>
      <div class="tabs" id="day-tabs"></div>
    </div>

    <!-- ── MI PLAN controls ── -->
    <div id="plan-controls" style="display:none">
      <div class="seg-tabs" style="padding-top:10px">
        <button class="seg-tab active" onclick="selectPlanWeek('semanas1-2',this)">Semanas 1-2</button>
        <button class="seg-tab"       onclick="selectPlanWeek('semanas3-4',this)">Semanas 3-4</button>
      </div>
      <div class="tabs" id="plan-day-tabs">
        <div class="tab active" onclick="showPlanDay(0,this)">Día 1 · Empujes</div>
        <div class="tab"        onclick="showPlanDay(1,this)">Día 2 · Tirones</div>
        <div class="tab"        onclick="showPlanDay(2,this)">Día 3 · Pierna+Brazo</div>
        <div class="tab"        onclick="showPlanDay(3,this)">Día 4 · Pecho+Espalda</div>
      </div>
    </div>

  </div><!-- /header -->

  <!-- Alternativas content -->
  <div id="week-content"><div class="loading">Cargando…</div></div>

  <!-- Mi Plan content -->
  <div id="plan-content"></div>

  <!-- Completion overlay -->
  <div id="completion-overlay" class="completion-overlay" onclick="closeCompletion()">
    <div class="completion-card" onclick="event.stopPropagation()">
      <span class="completion-emoji">🎉</span>
      <div class="completion-title">¡DÍA COMPLETADO!</div>
      <div class="completion-sub" id="completion-sub">Excelente sesión.<br>Sigue así, crack.</div>
      <button class="completion-btn" onclick="closeCompletion()">Continuar</button>
    </div>
  </div>

</div><!-- /app -->

<script>
/* ════════════════════════════════════════════════════════
   ALTERNATIVAS — código original sin modificar
════════════════════════════════════════════════════════ */

const WEEKS = [
  { id: 'semana4-5', label: 'Semanas 4-5' }
];

const _C = { u: 'tgmico', p: 'Clarmak893@' };

function doLogin() {
  const u = document.getElementById('inp-user').value.trim();
  const p = document.getElementById('inp-pass').value;
  if (u === _C.u && p === _C.p) {
    localStorage.setItem('entreno_auth', '1');
    document.getElementById('login-error').style.display = 'none';
    showApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('entreno_auth');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('inp-user').value = '';
  document.getElementById('inp-pass').value = '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const saved = parseInt(localStorage.getItem('entreno_week') || '0');
  loadWeek(Math.min(saved, WEEKS.length - 1));
  // Restore last main section
  const lastMain = localStorage.getItem('entreno_main') || 'alt';
  if (lastMain === 'plan') {
    const planTab = document.getElementById('main-tab-plan');
    showMain('plan', planTab);
  }
}

let currentWeek = 0;

function loadWeek(idx) {
  currentWeek = idx;
  localStorage.setItem('entreno_week', idx);
  document.getElementById('week-label').textContent = WEEKS[idx].label;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === WEEKS.length - 1;
  document.getElementById('day-tabs').innerHTML = '';
  document.getElementById('week-content').innerHTML = '<div class="loading">Cargando…</div>';
  const old = document.getElementById('_ws');
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = '_ws';
  s.src = 'weeks/' + WEEKS[idx].id + '.js';
  s.onload = () => renderWeek(window.WEEK_DATA);
  s.onerror = () => {
    document.getElementById('week-content').innerHTML =
      '<div class="loading">No se pudo cargar la semana.</div>';
  };
  document.head.appendChild(s);
}

function prevWeek() { if (currentWeek > 0) loadWeek(currentWeek - 1); }
function nextWeek() { if (currentWeek < WEEKS.length - 1) loadWeek(currentWeek + 1); }

function renderWeek(data) {
  document.getElementById('day-tabs').innerHTML = data.days
    .map((d, i) => `<div class="tab${i === 0 ? ' active' : ''}" onclick="showDay('${d.id}',this)">${d.label}</div>`)
    .join('');
  document.getElementById('week-content').innerHTML = data.days.map((d, i) => renderDay(d, i === 0)).join('');
  loadState();
  updateProgress();
}

function renderDay(day, active) {
  const total = day.groups.flatMap(g => g.exercises).length;
  return `
    <div class="section${active ? ' active' : ''}" id="${day.id}">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="fill-${day.id}"></div></div>
        <div class="progress-label" id="label-${day.id}">0 / ${total} completados</div>
      </div>
      ${day.groups.map(renderGroup).join('')}
    </div>`;
}

function renderGroup(g) {
  return `<div class="muscle-group">${g.label}</div>${g.exercises.map(renderExercise).join('')}`;
}

function renderExercise(ex) {
  return `
    <div class="exercise-card" id="${ex.id}">
      <div class="card-header">
        <div class="ex-icon">${ex.icon}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-muscle">${ex.muscle}</div>
        </div>
        <button class="done-btn" onclick="toggleDone('${ex.id}',event)">✓</button>
        <div class="alt-trigger" onclick="toggle('${ex.id}')">
          <span>Si está ocupado</span><span class="chevron">⌄</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-body-content">
          <div class="alt-header">${ex.altHeader}</div>
          ${ex.alternatives.map(renderAlt).join('')}
        </div>
      </div>
    </div>`;
}

function renderAlt(alt) {
  let h = '<div class="alt-item">';
  if (alt.appName) h += `<div class="app-name"><span class="app-name-label">En tu app</span><span class="app-name-value">${alt.appName}</span></div>`;
  h += `<div class="alt-item-name">${alt.name}</div>`;
  if (alt.desc) h += `<div class="alt-item-desc">${alt.desc}</div>`;
  if (alt.steps && alt.steps.length) {
    h += `<div class="steps-label">${alt.stepsLabel || 'Ejecución'}</div>`;
    h += alt.steps.map((s, i) => `<div class="step"><div class="step-num">${i + 1}</div><div class="step-text">${s}</div></div>`).join('');
  }
  if (alt.tip) {
    const t = typeof alt.tip === 'string' ? alt.tip : `<strong>${alt.tip.bold}</strong> ${alt.tip.text}`;
    h += `<div class="tip">${t}</div>`;
  }
  return h + '</div>';
}

function toggle(id) {
  const card = document.getElementById(id);
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('.exercise-card').forEach(c => c.classList.remove('open'));
  if (!wasOpen) card.classList.add('open');
}

function toggleDone(id, event) {
  event.stopPropagation();
  const card = document.getElementById(id);
  const btn  = card.querySelector('.done-btn');
  const done = card.classList.contains('done');
  card.classList.toggle('done', !done);
  btn.classList.toggle('active', !done);
  const state = getState();
  state[id] = !done;
  saveState(state);
  updateProgress();
}

function stateKey() { return 'entreno_done_' + WEEKS[currentWeek].id; }
function getState()  { try { return JSON.parse(localStorage.getItem(stateKey()) || '{}'); } catch { return {}; } }
function saveState(s) { localStorage.setItem(stateKey(), JSON.stringify(s)); }

function loadState() {
  const state = getState();
  Object.entries(state).forEach(([id, done]) => {
    if (!done) return;
    const card = document.getElementById(id);
    if (!card) return;
    card.classList.add('done');
    const btn = card.querySelector('.done-btn');
    if (btn) btn.classList.add('active');
  });
}

function updateProgress() {
  if (!window.WEEK_DATA) return;
  const state = getState();
  window.WEEK_DATA.days.forEach(day => {
    const ids   = day.groups.flatMap(g => g.exercises.map(e => e.id));
    const done  = ids.filter(id => state[id]).length;
    const total = ids.length;
    const fill  = document.getElementById('fill-' + day.id);
    const label = document.getElementById('label-' + day.id);
    if (!fill || !label) return;
    fill.style.width = (total ? done / total * 100 : 0) + '%';
    fill.classList.toggle('complete', done === total && total > 0);
    label.textContent = done + ' / ' + total + ' completados';
  });
}

function showDay(id, tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('#day-tabs .tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  tab.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  document.querySelectorAll('.seg-tabs:first-of-type .seg-tab, #main-tab-alt, #main-tab-plan')

  document.getElementById('plan-controls').style.display = isAlt ? 'none' : '';
  document.getElementById('week-content').style.display  = isAlt ? '' : 'none';
  document.getElementById('plan-content').style.display  = isAlt ? 'none' : '';

  if (!isAlt) renderPlanDay();
  localStorage.setItem('entreno_main', section);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ════════════════════════════════════════════════════════
   MI PLAN — LOGIC
════════════════════════════════════════════════════════ */

let planWeek = 'semanas1-2';
let planDay  = 0;

function planStateKey() { return 'plan_' + planWeek + '_' + planDay; }
function getPlanState()  { try { return JSON.parse(localStorage.getItem(planStateKey()) || '[]'); } catch { return []; } }
function savePlanState(arr) { localStorage.setItem(planStateKey(), JSON.stringify(arr)); }

function selectPlanWeek(wk, btn) {
  planWeek = wk;
  planDay  = 0;
  document.querySelectorAll('#plan-controls .seg-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#plan-day-tabs .tab').forEach((t, i) => t.classList.toggle('active', i === 0));
  renderPlanDay();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showPlanDay(idx, tab) {
  planDay = idx;
  document.querySelectorAll('#plan-day-tabs .tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  renderPlanDay();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPlanDay() {
  const day      = PLAN_DATA[planWeek].days[planDay];
  const doneArr  = getPlanState();
  const total    = day.exercises.length;
  const doneCount = doneArr.filter(Boolean).length;
  const pct      = total ? doneCount / total * 100 : 0;

  // Build dots
  const dots = PLAN_DATA[planWeek].days
    .map((_, i) => `<div class="plan-dot${i === planDay ? ' active' : ''}"></div>`)
    .join('');

  // Build exercise rows
  const exRows = day.exercises.map((name, i) => {
    const done = !!doneArr[i];
    return `
      <div class="plan-ex${done ? ' done' : ''}" id="pex-${i}" onclick="togglePlanEx(${i})">
        <div class="pex-num">${done ? '✓' : i + 1}</div>
        <div class="pex-name">${name}</div>
        <div class="pex-check">✓</div>
      </div>`;
  }).join('');

  document.getElementById('plan-content').innerHTML = `
    <div class="plan-day-header">
      <div>
        <div class="plan-day-title">${day.label}</div>
        <div class="plan-count" id="plan-count">${doneCount}/${total} ejercicios</div>
      </div>
      <button class="btn-reset" onclick="resetPlanDay()">↺ Resetear</button>
    </div>
    <div class="plan-pbar"><div class="plan-pfill${doneCount === total && total > 0 ? ' complete' : ''}" id="plan-pfill" style="width:${pct}%"></div></div>
    ${exRows}
    <div class="plan-dots">${dots}</div>`;
}

function togglePlanEx(idx) {
  const doneArr = getPlanState();
  // Ensure array is long enough
  const total = PLAN_DATA[planWeek].days[planDay].exercises.length;
  while (doneArr.length < total) doneArr.push(false);
  doneArr[idx] = !doneArr[idx];
  savePlanState(doneArr);

  // Update DOM without full re-render (smooth UX)
  const el      = document.getElementById('pex-' + idx);
  const numEl   = el.querySelector('.pex-num');
  const isDone  = doneArr[idx];
  el.classList.toggle('done', isDone);
  numEl.textContent = isDone ? '✓' : idx + 1;

  // Update progress
  const doneCount = doneArr.filter(Boolean).length;
  const pct = doneCount / total * 100;
  const pfill = document.getElementById('plan-pfill');
  const pcountEl = document.getElementById('plan-count');
  if (pfill) { pfill.style.width = pct + '%'; pfill.classList.toggle('complete', doneCount === total); }
  if (pcountEl) pcountEl.textContent = doneCount + '/' + total + ' ejercicios';

  // Completion check
  if (doneCount === total) {
    setTimeout(() => showCompletion(PLAN_DATA[planWeek].days[planDay].label), 400);
  }
}

function resetPlanDay() {
  const total = PLAN_DATA[planWeek].days[planDay].exercises.length;
  savePlanState(new Array(total).fill(false));
  renderPlanDay();
}

/* ── Completion ── */
function showCompletion(dayLabel) {
  document.getElementById('completion-sub').innerHTML =
    `${dayLabel}<br>Excelente sesión. Sigue así, crack. 💪`;
  document.getElementById('completion-overlay').classList.add('show');
}
function closeCompletion() {
  document.getElementById('completion-overlay').classList.remove('show');
}

/* ── Swipe between plan days ── */
(function() {
  let tx = 0, ty = 0;
  const el = document.getElementById('plan-content');
  el.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 52) {
      const maxDay = PLAN_DATA[planWeek].days.length - 1;
      if (dx < 0 && planDay < maxDay) {
        const nextTab = document.querySelectorAll('#plan-day-tabs .tab')[planDay + 1];
        showPlanDay(planDay + 1, nextTab);
      } else if (dx > 0 && planDay > 0) {
        const prevTab = document.querySelectorAll('#plan-day-tabs .tab')[planDay - 1];
        showPlanDay(planDay - 1, prevTab);
      }
    }
  }, { passive: true });
})();
